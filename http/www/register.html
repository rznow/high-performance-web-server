<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;

            background:url("/images/back.png") no-repeat center center;
            background-size:cover;

            font-family:"Microsoft YaHei",sans-serif;
        }

        .register-box{
            width:400px;
            padding:40px;

            background:rgba(255,255,255,0.9);
            border-radius:15px;

            box-shadow:0 0 20px rgba(0,0,0,0.2);
        }

        .register-box h2{
            text-align:center;
            margin-bottom:30px;
            color:#333;
        }

        .input-group{
            margin-bottom:20px;
        }

        .input-group input{
            width:100%;
            padding:12px;

            border:1px solid #ccc;
            border-radius:8px;

            font-size:16px;
        }

        .input-group input:focus{
            outline:none;
            border-color:#4CAF50;
        }

        .register-btn{
            width:100%;
            padding:12px;

            border:none;
            border-radius:8px;

            background:#4CAF50;
            color:white;

            font-size:16px;
            cursor:pointer;
        }

        .register-btn:hover{
            background:#45a049;
        }

        .login-link{
            margin-top:20px;
            text-align:center;
        }

        .login-link a{
            text-decoration:none;
            color:#4CAF50;
        }

        .login-link a:hover{
            text-decoration:underline;
        }
    </style>
</head>

<body>

    <div class="register-box">

        <h2>用户注册</h2>

        <form action="/register" method="POST">

            <div class="input-group">
                <input
                    type="text"
                    name="username"
                    placeholder="请输入用户名"
                    required>
            </div>

            <div class="input-group">
                <input
                    type="password"
                    name="password"
                    placeholder="请输入密码"
                    required>
            </div>

            <div class="input-group">
                <input
                    type="password"
                    name="confirm_password"
                    placeholder="请确认密码"
                    required>
            </div>

            <button type="submit" class="register-btn">
                注册
            </button>

        </form>

        <div class="login-link">
            已有账号？
            <a href="/login.html">立即登录</a>
        </div>

    </div>

</body>
</html>
