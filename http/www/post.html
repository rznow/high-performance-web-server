<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>帖子详情 - MiniForum</title>


    <link rel="stylesheet" href="/css/post.css">

</head>


<body>


<!-- 顶部导航 -->

<header class="navbar">


    <div class="logo">

        MiniForum

    </div>


    <div class="nav-user", id="nav-user">

        
    <!-- JS 动态生成 -->

    </div>


</header>




<!-- 内容区域 -->


<div class="container">



    <!-- 帖子主体 -->


    <div class="post-box">


        <h1 id="title">

            加载中...

        </h1>



        <div class="post-info">

            <div class="post-meta">
        
                <span id="author">
                    作者：
                </span>
        
                <span id="time">
                    时间：
                </span>
        
            </div>
        
            <div class="post-stat">
        
                <span id="likeCount">
                    👍 0
                </span>
        
            </div>
        
        </div>




        <hr>



        <div id="content"
             class="post-content">


            正在加载帖子内容...


        </div>

        <div class="post-action">

            <button id="likeBtn">
        
                👍 点赞
        
            </button>
        
            <button id="deleteBtn"
                    style="display:none;">
        
                🗑 删除
        
            </button>
        
        </div>



    </div>





    <!-- 评论区域 -->


    <div class="comment-box">


        <h2>

            评论

        </h2>



        <div id="commentList">


            <!-- 后续加载评论 -->


            <div class="comment">


                暂无评论


            </div>


        </div>




        <div class="comment-input">


            <textarea
                id="comment"
                placeholder="发表你的评论...">
            </textarea>



            <button id="sendComment">

                发表评论

            </button>


        </div>



    </div>




</div>




<script src="/js/post.js"></script>


</body>


</html>
